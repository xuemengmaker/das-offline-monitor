[project]
name = "das-monitor"
version = "0.1.0"
description = "Local DAS TDMS offline replay monitoring and background-graded warning system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "nptdms>=1.9,<2.0",
    "numpy>=2.1,<3.0",
    "scipy>=1.14,<2.0",
    "pydantic-settings>=2.5,<3.0",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.13,<3.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
